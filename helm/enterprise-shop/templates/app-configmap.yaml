apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: {{ .Release.Namespace | quote }}
data:
  POSTGRES_HOST: {{ .Values.postgres.host | quote }}
  POSTGRES_PORT: {{ .Values.postgres.port | quote }}

  REDIS_HOST: {{ .Values.redis.host | quote }}
  REDIS_PORT: {{ .Values.redis.port | quote }}

  KAFKA_BOOTSTRAP: {{ .Values.kafka.bootstrap | quote }}

  USER_SERVICE_URI: "http://user-service:8081"
  PRODUCT_SERVICE_URI: "http://product-service:8082"
  ORDER_SERVICE_URI: "http://order-service:8083"
  PAYMENT_SERVICE_URI: "http://payment-service:8084"
  NOTIFICATION_SERVICE_URI: "http://notification-service:8085"

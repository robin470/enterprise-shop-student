# Common image settings
image:
  tag: "1.0"
  pullPolicy: Never

# Number of replicas for each application service
replicaCount:
  userService: 1
  productService: 1
  orderService: 1
  paymentService: 1
  notificationService: 1
  apiGateway: 1
  frontend: 1

# Infrastructure services remain single-instance
infrastructure:
  postgres: 1
  redis: 1
  kafka: 1

# Database settings
postgres:
  host: postgres
  port: 5432
  user: shop
  database: users

# Redis settings
redis:
  host: redis
  port: 6379

# Kafka settings
kafka:
  bootstrap: kafka:9092

# Kubernetes resource settings
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

frontend:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

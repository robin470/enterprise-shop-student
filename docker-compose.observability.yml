
services:
  grafana:
    image: grafana/grafana:latest
    container_name: enterprise-shop-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_INSTALL_PLUGINS: ""
    volumes:
      - grafana-data:/var/lib/grafana
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5

  loki:
    image: grafana/loki:3.5.0
    container_name: enterprise-shop-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5

  alloy:
    image: grafana/alloy:v1.11.0
    container_name: enterprise-shop-alloy
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    ports:
      - "12345:12345"
    volumes:
      - ./alloy-config.alloy:/etc/alloy/config.alloy:ro
      - ./alloy-kubeconfig:/etc/alloy/kubeconfig:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - loki
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.25

  tempo:
    image: grafana/tempo:2.8.2
    container_name: enterprise-shop-tempo
    command: ["-config.file=/etc/tempo.yaml"]
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5

volumes:
  grafana-data:
  tempo-data:
